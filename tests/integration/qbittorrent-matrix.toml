# qBittorrent Docker version matrix -- single source of truth.
#
# Consumed by tests/integration/_matrix.py (loader), the local
# `make test-qbit-matrix` / `make test-qbit-version` / `make
# capture-qbit-fixtures` targets, and .github/workflows/qbittorrent-matrix.yml.
# Do not duplicate these entries anywhere else -- update this file only.
#
# Provenance: image tags and digests were pulled and inspected directly
# (`docker pull`, `docker inspect --format '{{index .RepoDigests 0}}'`)
# against Docker Hub on 2026-07-27, not taken from memory. The
# `linuxserver/qbittorrent` image was chosen because it is the most widely
# used, actively maintained qBittorrent container with per-release version
# tags going back through the 4.5.x/4.6.x line (verified via the Docker Hub
# tags API, not assumed) -- there is no image published by the qBittorrent
# project itself.
#
# A version is only added here once a real image has been pulled and its
# *observed* `app_version()` has been verified to match `expected_version`
# below (see docs/audits/2026-07-package-refactor-plan.md, Docker matrix
# implementation note).
#
# `qbit-5.2.3` was added 2026-07-27 as the then-current stable release
# (verified against https://api.github.com/repos/qbittorrent/qBittorrent/releases/latest,
# not memory) alongside the three historical entries below -- it does not
# replace any of them (see AGENTS.md's qBittorrent compatibility-claims
# policy: one patch release must not be generalized into a range, and the
# current stable release should be matrix-tested before a public release).

[[entry]]
id = "qbit-4.6.7"
image_repository = "linuxserver/qbittorrent"
image_tag = "4.6.7"
image_digest = "sha256:55f15d44396315551f87294a176efae733b16e283f38980308e46073950257c6"
release_line = "4.6.x"
expected_version = "v4.6.7"
expected_web_api_version = "2.9.3"
webui_port = 18110
capabilities = ["read_only", "mutations", "tracker_mutations", "capture"]
limitations = "Web API below the 2.11.0 stop/start threshold: qbit-ops's pause/resume path exercises torrents/pause and torrents/resume, not torrents/stop and torrents/start."
provenance = "docker pull linuxserver/qbittorrent:4.6.7 + docker inspect, 2026-07-27; last maintained 4.6.x tag per Docker Hub tags API at capture time."

