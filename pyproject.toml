[tool.poetry]
# Deliberately the legacy Poetry layout, with no PEP 621 `[project]`
# table: Release Please's `python` release type updates
# `[tool.poetry].version`, and `[project.optional-dependencies]` is
# silently ignored by poetry-core while this file stays fully legacy
# (see .agents/DECISIONS.md, 2026-07-25, TUI packaging).
name = "qbit-ops"
version = "0.4.0"
description = "qBittorrent administration CLI for homelab operations."
authors = ["LECOQQ <50244398+LECOQQ@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/LECOQQ/qbit-ops"
repository = "https://github.com/LECOQQ/qbit-ops"
documentation = "https://github.com/LECOQQ/qbit-ops/blob/main/docs/COMMANDS.md"
keywords = ["qbittorrent", "torrent", "cli", "tui", "homelab", "seedbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
packages = [
    { include = "qbit_ops", from = "src" },
    { include = "qbit_core", from = "src" },
]

[tool.poetry.urls]
Changelog = "https://github.com/LECOQQ/qbit-ops/blob/main/CHANGELOG.md"
Issues = "https://github.com/LECOQQ/qbit-ops/issues"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "*"
qbittorrent-api = "*"
typer = "*"
rich = "^15.0.0"
packaging = "*"
textual = { version = ">=8.2.8", optional = true }
mcp = { version = ">=1.0", optional = true }

[tool.poetry.extras]
tui = ["textual"]
mcp = ["mcp"]

[tool.poetry.scripts]
qbit-ops = "qbit_ops.cli.app:app"
qbit-ops-mcp = "qbit_ops.mcp.server:main"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pyright = "*"
commitizen = "*"
pre-commit = "*"
pytest-xdist = "^3.8.0"
twine = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ["py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 80
target-version = "py312"
exclude = [".venv", "__pycache__"]
# No `fix = true` here: that default applies to every invocation of
# `ruff check`, including `make lint`, which must only report. `make
# format` already passes `--fix` explicitly where fixing is wanted.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
# `mcp` is an optional extra: a normal `poetry install` leaves it out,
# so its import cannot be resolved in the default environment. The
# module that imports it is confined by R7 in tests/test_layering.py.
reportMissingImports = "warning"
include = ["src", "tests", "scripts", "demo"]
extraPaths = ["scripts", "demo"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]
addopts = "-q --maxfail=1 --disable-warnings --strict-markers"
asyncio_mode = "auto"
markers = [
    "tui: Textual TUI tests (the slowest block; excluded by `make check-fast`, run by `make test-tui` and `make check`).",
    "docker: tests that start a real, disposable Docker qBittorrent container (require QBIT_OPS_DOCKER_MATRIX=1; never run by `make check`/`make check-fast`).",
    "capture: tests that write to tests/compatibility/fixtures/captured-container/ (always also marked `docker`; only `make capture-qbit-fixtures` selects these).",
    "network: tests that reach the network (resolve dependencies from PyPI); excluded from `make check`/`make check-fast`, run by `make check-dist`.",
    "image: tests that build the container image locally (never push to any registry); excluded from `make check`/`make check-fast`, run by `make check-image`.",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.0"
tag_format = "v$version"
