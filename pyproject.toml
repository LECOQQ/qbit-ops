[tool.poetry]
name = "qbit-ops"
version = "0.2.0"
description = "qBittorrent administration CLI for homelab operations."
authors = []
readme = "README.md"
packages = [{ include = "qbit_ops", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "*"
qbittorrent-api = "*"
typer = "*"
rich = "^15.0.0"
packaging = "*"
textual = { version = ">=8.2.8", optional = true }

[tool.poetry.extras]
tui = ["textual"]

[tool.poetry.scripts]
qbit-ops = "qbit_ops.cli.app:app"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pyright = "*"
commitizen = "*"
pre-commit = "*"
pytest-xdist = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ["py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 80
target-version = "py312"
exclude = [".venv", "__pycache__"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["tests"]
addopts = "-q --maxfail=1 --disable-warnings --strict-markers"
asyncio_mode = "auto"
markers = [
    "tui: Textual TUI tests (slow: ~5 minutes; excluded by `make check-fast`, run by `make test-tui` and `make check`).",
    "docker: tests that start a real, disposable Docker qBittorrent container (require QBIT_OPS_DOCKER_MATRIX=1; never run by `make check`/`make check-fast`).",
    "capture: tests that write to tests/compatibility/fixtures/captured-container/ (always also marked `docker`; only `make capture-qbit-fixtures` selects these).",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "v$version"
