# Deterministic demo torrent inventory -- single source of truth for
# `generate_fixtures.py`, `seed_instance.py`, and `arm_transfer.py`.
# Order here is the order torrents are generated, added, and printed.
#
# desired_state is one of: seeding, completed-paused, stalled-download,
# incomplete-paused. payload_size is in bytes. transfer_demo (optional,
# defaults to false) marks the single fixture `arm_transfer.py` hands
# to the leecher container for the Overview's live transfer -- exactly
# one fixture must carry it.
#
# trackers (optional, defaults to []) holds announce URLs baked into the
# fixture's .torrent file at the top level, outside "info" -- see
# `generate_fixtures.py::_build_torrent` for why that can never change
# an infohash. Hosts are RFC 2606 `.example`/`.invalid` only, never a
# real tracker: `tracker-primary.example` and `tracker-mirror.example`
# resolve to the disposable tracker container (compose.yml) and answer
# `/announce`; `tracker-error.example` resolves to the same container
# but at a path it 404s on, for a tracker that responds with an error;
# `tracker-dead.invalid` never resolves at all.

[[fixture]]
name = "Ubuntu 24.04 Desktop ISO"
category = "linux"
extension = "iso"
payload_size = 3_000_000
desired_state = "seeding"
transfer_demo = true
trackers = ["http://tracker-primary.example:6969/announce"]

