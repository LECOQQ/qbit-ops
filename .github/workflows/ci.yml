name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # No skip for the release commit: its pull_request run waits for an
    # approval that never comes (github-actions[bot] counts as a
    # first-time contributor), so this push run is the only check it gets.
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml supports. Renovate does not read matrix
        # values: add a new Python here when it proposes it for the image.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Run CI
        run: make ci
