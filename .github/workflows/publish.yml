name: Publish

# Dispatched by release-please.yml once it has cut a release, and
# runnable by hand as a recovery path.
#
# This workflow must stay NON-reusable, and the publish job must stay
# defined here: PyPI's Trusted Publisher matches the `job_workflow_ref`
# OIDC claim against the declared workflow filename, and reusable
# workflows are explicitly unsupported -- calling this via
# `workflow_call` fails with `invalid-publisher`.
# https://docs.pypi.org/trusted-publishers/troubleshooting/
#
# Deliberately not `on: release` either: Release Please creates the
# GitHub Release with the default GITHUB_TOKEN, and events raised by
# that token do not start another workflow run. `workflow_dispatch` is
# a documented exception to that rule, which is why it is the trigger.
# https://docs.github.com/en/actions/concepts/security/github_token
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to build, verify and publish."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The environment PyPI's Trusted Publisher is configured against.
    environment:
      name: pypi
      url: https://pypi.org/p/qbit-ops

    permissions:
      # Mints the short-lived OIDC token Trusted Publishing exchanges for
      # an upload token. No PyPI API token is stored anywhere.
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Verify the declared version agrees with the release tag
        # Reuses the repository's existing version-consistency check
        # rather than introducing a second notion of "the version".
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            python3 scripts/check_version_sync.py --tag "${{ inputs.tag }}"
          else
            python3 scripts/check_version_sync.py
          fi

      - name: Build wheel and sdist
        run: poetry build

      - name: Validate the built artifacts
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check --strict dist/*

      - name: Verify the entrypoint works from the built wheel
        # Installs the real artifact into a throwaway virtualenv and runs
        # the console script, so a broken entry point fails here rather
        # than on a user's machine after `uv tool install`.
        run: |
          python3 -m venv /tmp/entrypoint-check
          /tmp/entrypoint-check/bin/python -m pip install --quiet dist/*.whl
          /tmp/entrypoint-check/bin/qbit-ops --version
          /tmp/entrypoint-check/bin/qbit-ops --help > /dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  bump-tap:
    name: Bump the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest

    # Nothing is written in THIS repository, so the default token needs
    # no scope at all. Write access to the tap comes from the PAT below,
    # which `GITHUB_TOKEN` could never provide: it is confined to the
    # repository the workflow runs in.
    permissions: {}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: LECOQQ/homebrew-qbit-ops
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Require the formula to already exist
        # Separated from the bump below so an unseeded tap fails in one
        # second with its own cause, instead of spending six retries
        # reporting that PyPI has not listed the release -- which would
        # be false, and would send the reader to the wrong system.
        run: |
          if [ ! -f tap/Formula/qbit-ops.rb ]; then
            echo "::error::tap/Formula/qbit-ops.rb is missing. The tap \
          must carry a formula before a release can bump it."
            exit 1
          fi

      - name: Point the formula at the published sdist
        # Retried, not raced: PyPI serves the upload before its JSON API
        # lists it, and a first-attempt 404 here would mean "not
        # published" -- which is exactly the message the script gives
        # for a genuinely missing release.
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          for attempt in 1 2 3 4 5 6; do
            if python3 source/scripts/bump_homebrew_formula.py \
                 tap/Formula/qbit-ops.rb --version "$version"; then
              exit 0
            fi
            echo "PyPI has not listed $version yet; retrying in 15s."
            sleep 15
          done
          echo "::error::PyPI never listed $version after 6 attempts."
          exit 1

      - name: Commit and push the bump
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "Formula already current; nothing to push."
            exit 0
          fi
          version="${{ inputs.tag || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qbit-ops.rb
          git commit -m "qbit-ops ${version#v}"
          git push
