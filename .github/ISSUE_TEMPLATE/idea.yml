name: Idea
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you picture it working.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or other tools, if any.
