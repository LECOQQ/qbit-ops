# gitleaks configuration for qbit-ops.
#
# Run through `make secrets`. Extends the upstream default ruleset
# rather than replacing it: a hand-written rule list goes stale the
# moment a new credential format appears, and nobody notices.
#
# A secret scanner is heuristic by nature, which is why `make secrets`
# is its own target rather than part of the blocking `make check` gate
# (see AGENTS.md, "Rien de probabiliste"). It reports; a human judges.

[extend]
useDefault = true

[[rules]]
# qBittorrent tracker passkeys are this project's real risk: they are
# credentials embedded in URLs, and the codebase handles, redacts and
# rewrites them. Named explicitly rather than left to entropy, which
# misses a low-entropy passkey and flags a high-entropy hash.
id = "qbit-tracker-passkey"
description = "Tracker announce URL carrying a named passkey"
regex = '''(?i)(?:https?|udp|wss?)://[^\s"']+[/?&](?:passkey|authkey|torrent_pass|rss_?key|apikey)[=/][A-Za-z0-9._-]{16,}'''
tags = ["passkey", "tracker"]

  # A passkey is only dangerous next to a host that exists. This
  # repository names every fixture host with an RFC 2606 reserved
  # domain -- `.example`, `.invalid`, `.test` -- with `.tld`, the
  # obviously-unregistrable convention it also uses, or with a Docker
  # network alias. Suppressing those turns a rule that fired twenty-one
  # times on fixtures into one that fires on a real host alone.
  #
  # An allowlist rather than a negative match: gitleaks compiles with
  # Go's RE2, which has no lookahead, so "a host that is not reserved"
  # cannot be written as a pattern.
  [rules.allowlist]
  description = "Reserved and local hosts carry no real credential"
  regexTarget = "match"
  regexes = [
    '''://[^\s"'/]*\.(?:example|invalid|test|tld|localdomain)(?::\d+)?/''',
    '''://(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::\d+)?/''',
    '''://[^\s"'/]*\.example\.(?:com|org|net)(?::\d+)?/''',
    '''://qbit-ops-[a-z-]+(?::\d+)?/''',
  ]

[[rules]]
# The shape the named rule above cannot see: a passkey dropped straight
# after `/announce/`, with no word to announce it. That is the form the
# trackers this project was written for actually use, and the one that
# reached a public article draft before being caught by hand.
#
# Anchored on `/announce/` rather than on the key's shape: a passkey has
# no distinguishing form, and a rule that hunts one alone drowns in
# checksums -- a scan of this repository's history found three matches
# for that shape, all of them a SHA-256 or a fixture.
id = "qbit-tracker-passkey-path"
description = "Tracker announce URL carrying an unnamed passkey segment"
regex = '''(?i)(?:https?|udp|wss?)://[^\s"']+/announce/[A-Za-z0-9._-]{12,}'''
tags = ["passkey", "tracker"]

  # A passkey is only dangerous next to a host that exists. This
  # repository names every fixture host with an RFC 2606 reserved
  # domain -- `.example`, `.invalid`, `.test` -- with `.tld`, the
  # obviously-unregistrable convention it also uses, or with a Docker
  # network alias. Suppressing those turns a rule that fired twenty-one
  # times on fixtures into one that fires on a real host alone.
  #
  # An allowlist rather than a negative match: gitleaks compiles with
  # Go's RE2, which has no lookahead, so "a host that is not reserved"
  # cannot be written as a pattern.
  [rules.allowlist]
  description = "Reserved and local hosts carry no real credential"
  regexTarget = "match"
  regexes = [
    '''://[^\s"'/]*\.(?:example|invalid|test|tld|localdomain)(?::\d+)?/''',
    '''://(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::\d+)?/''',
    '''://[^\s"'/]*\.example\.(?:com|org|net)(?::\d+)?/''',
    '''://qbit-ops-[a-z-]+(?::\d+)?/''',
  ]

[allowlist]
description = "Deliberate fixtures, never real credentials"

# `UNMISTAKABLE-` is the repo's own convention for a fake secret: a
# marker a test asserts never reaches an output, chosen to be
# recognisable on sight. Allowlisting the *marker* keeps the scanner
# fully live on the files that carry it -- unlike excluding `tests/`,
# which is exactly where a real credential gets pasted while debugging.
regexes = ['''UNMISTAKABLE-[A-Z0-9-]+''']

# Generated, reproducible, or vendored -- never authored here.
#
# Anchored `(^|/)` rather than `^`: `dir` mode (`make secrets`, the
# default scope) walks the raw filesystem and does not consult
# `.gitignore`, so a root-only anchor misses the same disposable
# directory one level down -- e.g. `.worktrees/<feature>/.venv/`, which
# `scripts/worktree_new.py` creates for every worktree. That gap once
# let 27 vendored-stub false positives (pywin32, cryptography, jwt,
# paramiko typeshed stubs) through a single nested `.venv/`, which is
# exactly the noise a real leak would hide in.
#
# The agent telemetry log IS excluded -- the second reversal of this
# decision, written down so a third one starts informed. It was first
# excluded for self-reference (a scan writes the pattern it searches
# for into the log), then re-included because the collector redacts
# credentials, which made scanning it the proof that the redaction
# still worked.
#
# What broke that: a builder testing this very config wrote a probe
# containing `key: X25519PrivateKey`, copied from a paramiko typeshed
# stub. The collector left it alone because it is not a credential --
# it is a class name -- and `generic-api-key` fired, blocking `make
# check` on a file that is gitignored and can never be committed. A
# verbatim log of shell commands will keep producing such strings.
#
# What that costs, stated here rather than discovered later: no rule
# scans the log any more, `qbit-tracker-passkey` included, so nothing
# verifies the collector's redaction. Scoping the exclusion to the one
# generic rule would have kept that proof, but its only syntax
# (`[[allowlists]]` with `targetRules`) is silently ignored by older
# gitleaks -- verified on the installed build -- and this config is
# held to 8.16 through 8.30. A rule muzzled on one version and live on
# another is worse than either choice made plainly.
paths = [
    '''(^|/)\.agents/telemetry/''',
    '''(^|/)\.venv/''',
    '''(^|/)dist/''',
    '''(^|/)htmlcov/''',
    '''(^|/)__pycache__/''',
    '''(^|/)poetry\.lock$''',
]
